            <span class="category-count">${cat.products.length}</span>
          </button>
        `).join('')}
      </div>
    `;

      btn.addEventListener('click', () => {
        currentCategory = btn.dataset.cat;
        renderCategoryNav(tabKey);
        renderProducts(tabKey);
      });
    });
  }

  function renderProducts(tabKey) {
    const tab = recommendData[tabKey];
    const cat = tab.categories.find(c => c.id === currentCategory);

    if (!cat) {
      productArea.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><h3>暂无商品</h3></div>';
      return;
    }

    productArea.innerHTML = `
      <div class="product-area-header">
        <h2>${cat.name}</h2>
        <span class="product-count">共 ${cat.products.length} 款推荐</span>
      </div>
      <div class="product-grid">
        ${cat.products.map(p => renderProductCard(p, tabKey, cat.id)).join('')}
      </div>
    `;

  function renderProductCard(p, tabKey, catId) {
    return `
      <a href="${p.link}" class="product-card" style="text-decoration:none;color:inherit;">

        </div>
        <div class="product-info">

          <p class="product-desc">${p.desc}</p>
          <div class="product-tags">
            ${p.tags.map(t => `<span class="product-tag">${t}</span>`).join('')}
          </div>
          <div class="product-price-row">
            <span class="product-price">${p.price}</span>
            <span class="product-btn-text">去看看 &rarr;</span>
          </div>
        </div>
      </a>
    `;
  }

    currentTab = tabKey;
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tabKey));
    renderCategoryNav(tabKey);
    renderProducts(tabKey);
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => selectTab(tab.dataset.tab));
  });
