        ]},

          { name: '85%黑巧克力', image: '🍫', desc: '高可可含量，控糖期也能吃的甜品', tags: ['低糖', '高抗氧化'], button: '查看推荐理由' },

    drink: {

          { name: '大麦茶', image: '🌾', desc: '解腻助消化，大餐后来一杯', tags: ['零热量', '助消化'], button: '去尝尝这款' }
        ]},
        { id: 'milk', name: '乳品饮品', products: [

          { name: '燕麦奶', image: '🥣', desc: '植物奶替代，低卡无乳糖', tags: ['低卡', '无乳糖', '低脂'], button: '去尝尝这款' }
        ]},
        { id: 'juice', name: '鲜榨果汁', products: [
          { name: '鲜榨橙汁', image: '🍊', desc: '天然维C加油站，一杯满足每日所需', tags: ['高维C', '天然'], button: '查看推荐理由' },
          { name: '蓝莓汁', image: '🫐', desc: '花青素之王，护眼抗氧化', tags: ['高抗氧化', '护眼'], button: '查看推荐理由' }
        ]}
      ]
    },
    seasoning: {
      label: '低卡调味',
      categories: [
        { id: 'sauce', name: '健康酱料', products: [
          { name: '0脂油醋汁', image: '🥗', price: '¥15.9', desc: '0脂肪、低钠配方，拌沙拉或凉拌菜的完美搭档，控卡期必备。', tags: ['控卡', '轻食搭档'], link: 'https://example.com/affiliate/oil-vinegar' },
          { name: '无糖番茄酱', image: '🍅', price: '¥12.8', desc: '用代糖替代白砂糖，保留番茄风味，搭配鸡胸肉或全麦面包都合适。', tags: ['低GI', '儿童友好'], link: 'https://example.com/affiliate/tomato-sauce' },
          { name: '薄盐生抽', image: '🫙', price: '¥18.5', desc: '钠含量比普通生抽低30%以上，日常炒菜或蘸料都适合。', tags: ['减盐', '家庭必备'], link: 'https://example.com/affiliate/light-soy-sauce' },
          { name: '魔芋辣酱', image: '🌶️', price: '¥16.9', desc: '以魔芋为基底，辣味足但热量极低，重口味人群解馋利器。', tags: ['高蛋白', '饱腹感强'], link: 'https://example.com/affiliate/konjac-chili' },
          { name: '柠檬胡椒盐', image: '🍋', price: '¥14.5', desc: '天然柠檬粉+黑胡椒+海盐混合，无添加糖和味精，煎鱼或烤蔬菜首选。', tags: ['天然香料', '无添加'], link: 'https://example.com/affiliate/lemon-pepper' }
        ]}
      ]
    }
  };

  var tabs = document.querySelectorAll('.recommend-tab');
  var categoryNav = document.getElementById('categoryNav');
  var productArea = document.getElementById('productArea');
  var currentTab = 'staple';
  var currentCategory = null;

  function getTab(tabKey) {
    return recommendData[tabKey];
  }

  function findCategory(tabKey, catId) {
    var tab = getTab(tabKey);
    if (!tab) return null;
    return tab.categories.find(function(c) { return c.id === catId; });
  }

  function renderCategoryNav(tabKey) {
    var tab = getTab(tabKey);
    if (!tab) return;

    var validIds = tab.categories.map(function(c) { return c.id; });
    if (!currentCategory || validIds.indexOf(currentCategory) === -1) {
      currentCategory = tab.categories[0].id;
    }

    var html = '<div class="category-nav-title">' + tab.label + '</div>';
    html += '<div class="category-nav-list">';
    tab.categories.forEach(function(cat) {
      var active = cat.id === currentCategory ? ' active' : '';
      html += '<button class="category-nav-item' + active + '" data-cat="' + cat.id + '">';
      html += cat.name;
      html += '<span class="category-count">' + cat.products.length + '</span>';
      html += '</button>';
    });
    html += '</div>';

    categoryNav.innerHTML = html;
  }

  function renderProducts(tabKey) {
    var tab = getTab(tabKey);
    if (!tab) return;

    var cat = findCategory(tabKey, currentCategory);
    if (!cat) {
      productArea.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><h3>暂无商品</h3></div>';
      return;
    }

    var html = '<div class="product-area-header">';
    html += '<h2>' + cat.name + '</h2>';
    html += '<span class="product-count">共 ' + cat.products.length + ' 款推荐</span>';
    html += '</div>';
    html += '<div class="product-grid">';
    cat.products.forEach(function(p) {
      html += renderProductCard(p, tabKey, cat.id);
    });
    html += '</div>';

    productArea.innerHTML = html;
  }

  function renderProductCard(p, tabKey, catId) {
    var href, priceHtml, btnText;

    if (p && p.link) {
      href = p.link;
    } else {
      href = 'product-list.html?tab=' + encodeURIComponent(tabKey) + '&category=' + encodeURIComponent(catId);
    }

    if (p && p.price) {
      priceHtml = '<span class="product-price">' + p.price + '</span>';
    } else {
      priceHtml = '';
    }

    if (p && p.link) {
      btnText = '去看看 →';
    } else if (p && p.button) {
      btnText = p.button;
    } else {
      btnText = '查看该类目 →';
    }

    var tagsHtml = '';
    if (p && p.tags) {
      tagsHtml = p.tags.map(function(t) {
        return '<span class="product-tag">' + t + '</span>';
      }).join('');
    }

    return '<a href="' + href + '" class="product-card" style="text-decoration:none;color:inherit;">' +
      '<div class="product-image">' +
        '<span class="product-emoji">' + (p ? (p.image || '📦') : '📦') + '</span>' +
      '</div>' +
      '<div class="product-info">' +
        '<h3 class="product-name">' + (p ? (p.name || '未知商品') : '未知商品') + '</h3>' +
        '<p class="product-desc">' + (p ? (p.desc || '') : '') + '</p>' +
        '<div class="product-tags">' + tagsHtml + '</div>' +
        '<div class="product-price-row">' +
          priceHtml +
          '<span class="product-btn-text">' + btnText + '</span>' +
        '</div>' +
      '</div>' +
    '</a>';
  }

  function selectTab(tabKey) {
    currentTab = tabKey;
    tabs.forEach(function(t) {
      t.classList.toggle('active', t.dataset.tab === tabKey);
    });
    renderCategoryNav(tabKey);
    renderProducts(tabKey);
  }

  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      selectTab(tab.dataset.tab);
    });
  });

  categoryNav.addEventListener('click', function(e) {
    var target = e.target;
    while (target && target !== categoryNav) {
      if (target.classList && target.classList.contains('category-nav-item')) {
        var catId = target.dataset.cat;
        if (catId && catId !== currentCategory) {
          currentCategory = catId;
          renderCategoryNav(currentTab);
          renderProducts(currentTab);
        }
        return;
      }
      target = target.parentNode;
    }
  });

  selectTab('staple');

})();
</script>
