      currentCategory = tab.categories[0].id;
    }

    var html = '<div class="category-nav-title">' + tab.label + '</div>';
    html += '<div class="category-nav-list">';
    tab.categories.forEach(function(cat) {
      var active = cat.id === currentCategory ? ' active' : '';
      html += '<button class="category-nav-item' + active + '" data-cat="' + cat.id + '">';
      html += cat.name;
      html += '<span class="category-count">' + cat.products.length + '</span>';
      html += '</button>';
    });
    html += '</div>';

    categoryNav.innerHTML = html;
  }

  function renderProducts(tabKey) {
    var tab = getTab(tabKey);
    if (!tab) return;

    var cat = findCategory(tabKey, currentCategory);
    if (!cat) {
      productArea.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><h3>暂无商品</h3></div>';
      return;
    }

    var html = '<div class="product-area-header">';
    html += '<h2>' + cat.name + '</h2>';
    html += '<span class="product-count">共 ' + cat.products.length + ' 款推荐</span>';
    html += '</div>';
    html += '<div class="product-grid">';
    cat.products.forEach(function(p) {
      html += renderProductCard(p, tabKey, cat.id);
    });
    html += '</div>';

    productArea.innerHTML = html;
    initSpecCards();
  }

  function renderProductCard(p, tabKey, catId) {
    if (p && p.specs) {
      return renderSpecCard(p);
    }

    var href, priceHtml, btnText;

    if (p && p.link) {
      href = p.link;
    } else {
      href = '#';
    }

    if (p && p.price) {
      priceHtml = '<span class="product-price">' + p.price + '</span>';
    } else {
      priceHtml = '';
    }

    btnText = '去看看 →';

    var tagsHtml = '';
    if (p && p.tags) {
      tagsHtml = p.tags.map(function(t) {
        return '<span class="product-tag">' + t + '</span>';
      }).join('');
    }

    return '<a href="' + href + '" class="product-card" style="text-decoration:none;color:inherit;">' +
      '<div class="product-image">' +
        '<span class="product-emoji">' + (p ? (p.image || '📦') : '📦') + '</span>' +
      '</div>' +
      '<div class="product-info">' +
        '<h3 class="product-name">' + (p ? (p.name || '未知商品') : '未知商品') + '</h3>' +
        '<p class="product-desc">' + (p ? (p.desc || '') : '') + '</p>' +
        '<div class="product-tags">' + tagsHtml + '</div>' +
        '<div class="product-price-row">' +
          priceHtml +
          '<span class="product-btn-text">' + btnText + '</span>' +
        '</div>' +
        '<p class="product-disclaimer">本站仅为商品推荐平台，实际交易由商家完成，如有问题请联系商家或淘宝客服处理。</p>' +
      '</div>' +
    '</a>';
  }

  function renderSpecCard(p) {
    var specs = p.specs;
    var tagsHtml = '';
    if (p.tags) {
      tagsHtml = p.tags.map(function(t) {
        return '<span class="product-tag">' + t + '</span>';
      }).join('');
    }

    var qtyHtml = '<div class="spec-row">' +
      '<span class="spec-label">数量</span>' +
      '<div class="spec-options">' +
      specs.quantities.map(function(q) {
        return '<button class="spec-option" data-group="qty" data-id="' + q.id + '" title="' + q.label + '">' +
          q.label + (q.price ? ' · ' + q.price : '') +
        '</button>';
      }).join('') +
      '</div>' +
    '</div>';

    var typeHtml = '<div class="spec-row">' +
      '<span class="spec-label">种类</span>' +
      '<div class="spec-options">' +
      specs.types.map(function(t) {
        return '<button class="spec-option" data-group="type" data-id="' + t.id + '" title="' + t.label + '">' +
          t.label +
        '</button>';
      }).join('') +
      '</div>' +
    '</div>';

    return '<div class="product-card spec-card" data-default-qty="' + specs.defaultQty + '" data-default-type="' + specs.defaultType + '">' +
      '<div class="product-image">' +
        '<span class="product-emoji">' + (p.image || '📦') + '</span>' +
      '</div>' +
      '<div class="product-info">' +
        '<h3 class="product-name">' + (p.name || '未知商品') + '</h3>' +
        '<p class="product-desc">' + (p.desc || '') + '</p>' +
        '<div class="product-tags">' + tagsHtml + '</div>' +
        qtyHtml +
        typeHtml +
        '<div class="product-price-row spec-price-row">' +
          '<span class="product-price spec-price">' + (specs.quantities[0].price || '') + '</span>' +
          '<button class="spec-buy-btn" data-link="' + specs.matrix[specs.defaultQty][specs.defaultType] + '">立即购买 →</button>' +
        '</div>' +
        '<p class="product-disclaimer">本站仅为商品推荐平台，实际交易由商家完成，如有问题请联系商家或淘宝客服处理。</p>' +
      '</div>' +
    '</div>';
  }

  function initSpecCards() {
    document.querySelectorAll('.spec-card').forEach(function(card) {
      var specs = null;
      var productArea = card.closest('#productArea') || document.getElementById('productArea');
      if (!productArea) return;
      var tabKey = currentTab;
      var catId = currentCategory;
      var tab = recommendData[tabKey];
      if (!tab) return;
      var cat = tab.categories.find(function(c) { return c.id === catId; });
      if (!cat) return;
      var p = cat.products.find(function(pr) { return pr.specs && card.querySelector('.product-name').textContent === pr.name; });
      if (!p) return;
      specs = p.specs;

      var state = {
        qty: specs.defaultQty,
        type: specs.defaultType
      };

      function updateUI() {
        card.querySelectorAll('.spec-option').forEach(function(btn) {
          var group = btn.dataset.group;
          var id = btn.dataset.id;
          btn.classList.toggle('active', group === 'qty' ? id === state.qty : id === state.type);
        });
        var currentQty = specs.quantities.find(function(q) { return q.id === state.qty; });
        var priceEl = card.querySelector('.spec-price');
        if (priceEl) {
          priceEl.textContent = currentQty ? currentQty.price : '';
        }
        var buyBtn = card.querySelector('.spec-buy-btn');
        var link = specs.matrix[state.qty] && specs.matrix[state.qty][state.type];
        if (buyBtn && link) {
          buyBtn.dataset.link = link;
        }
      }

      card.addEventListener('click', function(e) {
        var target = e.target;
        while (target && target !== card) {
          if (target.classList && target.classList.contains('spec-option')) {
            var group = target.dataset.group;
            var id = target.dataset.id;
            if (group === 'qty') state.qty = id;
            else if (group === 'type') state.type = id;
            updateUI();
            return;
          }
          if (target.classList && target.classList.contains('spec-buy-btn')) {
            var link = target.dataset.link;
            if (link) {
              window.open(link, '_blank');
            }
            return;
          }
          target = target.parentNode;
        }
      });

      updateUI();
    });
  }

  function selectTab(tabKey) {
    currentTab = tabKey;
    tabs.forEach(function(t) {
      t.classList.toggle('active', t.dataset.tab === tabKey);
    });
    renderCategoryNav(tabKey);
    renderProducts(tabKey);
  }

  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      selectTab(tab.dataset.tab);
    });
  });

  categoryNav.addEventListener('click', function(e) {
    var target = e.target;
    while (target && target !== categoryNav) {
      if (target.classList && target.classList.contains('category-nav-item')) {
        var catId = target.dataset.cat;
        if (catId && catId !== currentCategory) {
          currentCategory = catId;
          renderCategoryNav(currentTab);
          renderProducts(currentTab);
        }
        return;
      }
      target = target.parentNode;
    }
  });

  selectTab('staple');

})();
</script>
</body>
</html>
