  function getQueryParam(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function hexToRgb(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  function renderTag(tag, colorClass) {
    var colorMap = {
      'green': 'tag-green',
      'orange': 'tag-orange',
      'blue': 'tag-blue',
      'purple': 'tag-purple',
      'red': 'tag-red'
    };
    return '<span class="detail-tag ' + (colorMap[colorClass] || 'tag-green') + '">' + tag + '</span>';
  }

  function renderProductCard(item, tabKey, categoryKey) {
    var badgeHtml = '';
    if (item.badge && item.badgeText) {
      badgeHtml = '<div class="detail-card-badge ' + item.badge + '">' + item.badgeText + '</div>';
    }

    var tagsHtml = item.tags.map(function(t, i) {
      return renderTag(t, item.tagColor ? item.tagColor[i] : 'green');
    }).join('');

    var targetLink;
    var buttonText;
    if (item.link) {
      targetLink = item.link;
      buttonText = '去看看';
    } else {
      targetLink = 'product-detail.html?tab=' + tabKey + '&category=' + categoryKey + '&id=' + encodeURIComponent(item.name);
      buttonText = '查看详情';
    }

    var priceHtml = (item.price || '') + '<span class="unit">' + (item.unit || '') + '</span>';

    return `
      <div class="detail-card" data-link="${targetLink}">
        <div class="detail-card-image">
          ${badgeHtml}
          <span class="detail-emoji">${item.image || '📦'}</span>
        </div>
        <div class="detail-card-info">
          <div class="detail-brand">${item.brand || ''}</div>
          <h3 class="detail-card-name">${item.name || '未知商品'}</h3>
          <p class="detail-card-desc">${item.desc || ''}</p>
          <div class="detail-card-tags">${tagsHtml}</div>
          <div class="detail-card-price">
            <div class="detail-price">${priceHtml}</div>
            <button class="detail-link-btn" data-link="${targetLink}">${buttonText} &rarr;</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderDetail() {
    var tabKey = getQueryParam('tab') || 'staple';
    var categoryKey = getQueryParam('category') || '';
    var sortBy = getQueryParam('sort') || 'default';

    var tab = productDatabase[tabKey];
    if (!tab) {
      document.getElementById('detailHeader').innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><h3>未找到该品类</h3></div>';
      return;
    }

    var categories = tab.categories;

    if (!categoryKey || !categories[categoryKey]) {
      var firstKey = Object.keys(categories)[0];
      categoryKey = firstKey;
    }

    var cat = categories[categoryKey];
    var items = cat.items.slice();

    if (sortBy === 'popular') {
      items.sort(function(a, b) {
        var aHot = a.badge === 'hot' ? 1 : 0;
        var bHot = b.badge === 'hot' ? 1 : 0;
        return bHot - aHot;
      });
    } else if (sortBy === 'price') {
      items.sort(function(a, b) {
        var ap = parseFloat(a.price.replace(/[^\d.]/g, ''));
        var bp = parseFloat(b.price.replace(/[^\d.]/g, ''));
        return ap - bp;
      });
    }

    document.title = cat.name + ' - ' + tab.label + ' | 知食分子';

    document.getElementById('breadcrumb').innerHTML =
      '<a href="food-recommend.html">' + tab.label + '</a>' +
      '<span class="sep">›</span>' +
      '<span class="current">' + cat.name + '</span>';

    document.getElementById('detailHeader').innerHTML = `
      <h1>${cat.name}</h1>
      <p class="detail-sub">${cat.desc}</p>
      <div class="detail-stats">
        <span>📦 共 <strong>${items.length}</strong> 款精选产品</span>
        <span>🏷️ ${tab.label}</span>
      </div>
    `;

    document.getElementById('detailTitle').textContent = cat.name + ' · 精选推荐';

    document.getElementById('detailProductGrid').innerHTML = items.map(function(item){return renderProductCard(item, tabKey, categoryKey);}).join('');

    var relatedKeys = Object.keys(categories).filter(function(k) { return k !== categoryKey; });
    if (relatedKeys.length > 0) {
      document.getElementById('relatedSection').style.display = 'block';
      document.getElementById('relatedLinks').innerHTML = relatedKeys.map(function(k) {
        return '<a href="product-list.html?tab=' + tabKey + '&category=' + k + '" class="related-link">' + categories[k].name + ' (' + categories[k].items.length + '款)</a>';
      }).join('');
    }
  }

  document.querySelectorAll('.detail-sort-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.detail-sort-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var sort = btn.dataset.sort;
      var tabKey = getQueryParam('tab') || 'staple';
      var categoryKey = getQueryParam('category') || '';
      window.location.href = 'product-list.html?tab=' + tabKey + '&category=' + categoryKey + '&sort=' + sort;
    });
  });

  renderDetail();

  var detailGrid = document.getElementById('detailProductGrid');
  if (detailGrid) {
    detailGrid.addEventListener('click', function(e) {
      var target = e.target;
      while (target && target !== detailGrid) {
        if (target.classList && target.classList.contains('detail-link-btn')) {
          var link = target.dataset.link;
          if (link) { window.location.href = link; }
          return;
        }
        if (target.classList && target.classList.contains('detail-card')) {
          var link = target.dataset.link;
          if (link) { window.location.href = link; }
          return;
        }
        target = target.parentNode;
      }
    });
  }

})();
