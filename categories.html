<script src="data.js"></script>
<script>
  const categoryConfig = {
    "水果": { icon: "🍎", description: "富含维生素、矿物质和膳食纤维" },
    "蔬菜": { icon: "🥬", description: "低热量高营养，维生素和矿物质的重要来源" },
    "肉类": { icon: "🥩", description: "优质蛋白质、铁和B族维生素的良好来源" },
    "水产": { icon: "🐟", description: "富含Omega-3脂肪酸和优质蛋白质" },
    "蛋奶": { icon: "🥚", description: "钙、蛋白质和多种营养素的重要来源" },
    "谷物": { icon: "🍚", description: "碳水化合物的主要来源，提供能量" },
    "豆类": { icon: "🫘", description: "植物蛋白之王，富含膳食纤维" },
    "坚果": { icon: "🥜", description: "健康脂肪、维生素E和矿物质的来源" },
    "饮料": { icon: "🥤", description: "注意选择低糖分、高营养的饮品" },
    "零食": { icon: "🍪", description: "高热量食品，建议适量食用" }
  };

  const navContainer = document.getElementById('categoryNav');
  Object.keys(categoryConfig).forEach(cat => {
    const link = document.createElement('a');
    link.href = '#' + cat;
    link.textContent = categoryConfig[cat].icon + ' ' + cat;
    navContainer.appendChild(link);
  });

  const categoriesMap = {};
  foodDatabase.forEach(food => {
    if (!categoriesMap[food.category]) {
      categoriesMap[food.category] = [];
    }
    categoriesMap[food.category].push(food);
  });

  const container = document.getElementById('categoriesContainer');
  Object.keys(categoryConfig).forEach(category => {
    const foods = categoriesMap[category] || [];
    const config = categoryConfig[category];
    
    const section = document.createElement('section');
    section.className = 'category-section';
    section.id = category;
    
    section.innerHTML = `
      <div class="category-title">
        <span class="category-icon">${config.icon}</span>
        <h2>${category}</h2>
        <span class="count">${foods.length} 种食品</span>
      </div>
      <p style="color: var(--text-light); margin-bottom: 20px;">${config.description}</p>
      <div class="food-grid">
        ${foods.map(food => `
          <div class="food-item" onclick="window.location.href='index.html?search=${encodeURIComponent(food.name)}'">
            <div class="food-item-name">${food.name}</div>
            <div>
              <span class="food-item-cal">${food.calories}</span>
              <span class="food-item-unit"> 千卡/100g</span>
            </div>
            <div class="food-item-macros">
              <span>蛋白${food.protein}g</span>
              <span>脂肪${food.fat}g</span>
              <span>碳水${food.carbs}g</span>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    
    container.appendChild(section);
  });
</script>
