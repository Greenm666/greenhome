<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品营养搜索引擎</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <span class="logo-icon">🥗</span>
      <h1>食品营养搜索引擎</h1>
    </div>
    <p class="subtitle">快速查询食品的营养成分，守护您的健康</p>
  </header>

  <section class="search-section">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="输入食品名称，如：苹果、鸡胸肉、米饭..." autofocus>
      <button id="searchBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        搜索
      </button>
    </div>
    <div class="filter-bar">
      <span class="filter-label">分类筛选：</span>
      <div class="filter-tags" id="filterTags">
        <button class="tag active" data-category="all">全部</button>
        <button class="tag" data-category="水果">水果</button>
        <button class="tag" data-category="蔬菜">蔬菜</button>
        <button class="tag" data-category="肉类">肉类</button>
        <button class="tag" data-category="水产">水产</button>
        <button class="tag" data-category="蛋奶">蛋奶</button>
        <button class="tag" data-category="谷物">谷物</button>
        <button class="tag" data-category="豆类">豆类</button>
        <button class="tag" data-category="坚果">坚果</button>
        <button class="tag" data-category="饮料">饮料</button>
        <button class="tag" data-category="零食">零食</button>
      </div>
    </div>
  </section>

  <section class="stats-bar" id="statsBar">
    <span id="resultCount"></span>
  </section>

  <main class="results" id="results"></main>

  <div class="detail-modal" id="detailModal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <footer class="footer">
    <p>数据仅供参考，实际营养成分可能因品牌、产地、烹饪方式等因素有所不同</p>
  </footer>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
